<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎙️</text></svg>">
<meta name="voice-auth" content="__VOICE_AUTH__">
<title>Voice Lab — gpt-realtime-2.1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root {
  --ink: #12141c;
  --panel: #1a1e2a;
  --well: #141824;
  --line: #2a3042;
  --text: #e8e6df;
  --dim: #8b91a5;
  --you: #6aa5ff;
  --model: #ffb454;
  --danger: #ff6a66;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ink); color: var(--text);
  font-family: "Space Grotesk", -apple-system, "Segoe UI", sans-serif;
  line-height: 1.5; min-height: 100vh;
}
.wrap { max-width: 1060px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }

header { display: flex; align-items: baseline; justify-content: space-between;
  flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
.eyebrow {
  font-family: "IBM Plex Mono", monospace; font-size: 0.7rem; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--dim);
}
h1 { font-size: 1.5rem; font-weight: 700; margin: 0.1rem 0 0; letter-spacing: -0.01em; }
h1 .accent { color: var(--model); }

.app { display: grid; grid-template-columns: 320px 1fr; gap: 1.25rem; align-items: start; }
@media (max-width: 880px) {
  .app { grid-template-columns: 1fr; }
  .stage { order: -1; }
}

/* ---- Channel strip (settings) ---- */
fieldset#settings {
  border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
  padding: 1.1rem 1.1rem 1.25rem; margin: 0; display: grid; gap: 0.9rem;
}
fieldset#settings:disabled { opacity: 0.45; }
legend {
  font-family: "IBM Plex Mono", monospace; font-size: 0.7rem; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--dim); padding: 0 0.5rem;
}
.field { display: grid; gap: 0.35rem; }
.field > label {
  font-family: "IBM Plex Mono", monospace; font-size: 0.68rem; letter-spacing: 0.12em;
  text-transform: uppercase; color: var(--dim);
}
.val { color: var(--model); font-family: "IBM Plex Mono", monospace;
  font-size: 0.68rem; text-transform: none; letter-spacing: 0; }
select, textarea {
  width: 100%; background: var(--well); color: var(--text);
  border: 1px solid var(--line); border-radius: 10px; padding: 0.55rem 0.65rem;
  font: 0.92rem "Space Grotesk", sans-serif;
}
textarea { min-height: 4.6rem; resize: vertical; line-height: 1.45; }
input[type=range] { width: 100%; accent-color: var(--model); }
select:focus-visible, textarea:focus-visible, input:focus-visible,
button:focus-visible, summary:focus-visible {
  outline: 2px solid var(--model); outline-offset: 2px;
}

/* ---- Stage ---- */
.stage { display: grid; gap: 1rem; }
.orbPanel {
  position: relative; border: 1px solid var(--line); border-radius: 14px;
  background:
    radial-gradient(ellipse 60% 70% at 50% 45%, #1d2333 0%, var(--well) 70%);
  overflow: hidden;
}
#viz { width: 100%; height: 230px; display: block; }
#lamp {
  position: absolute; top: 0.8rem; right: 0.9rem;
  font-family: "IBM Plex Mono", monospace; font-size: 0.66rem;
  letter-spacing: 0.14em; text-transform: uppercase;
  padding: 0.28rem 0.65rem; border-radius: 99px;
  border: 1px solid var(--line); color: var(--dim); background: rgba(0,0,0,0.25);
}
#lamp.live {
  color: #201405; background: var(--model); border-color: var(--model);
  box-shadow: 0 0 18px rgba(255,180,84,0.45);
  animation: lampPulse 2.4s ease-in-out infinite;
}
@keyframes lampPulse {
  50% { box-shadow: 0 0 6px rgba(255,180,84,0.25); }
}
#status {
  position: absolute; left: 0.9rem; top: 0.8rem;
  font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; color: var(--dim);
  max-width: 70%;
}

.transport { display: flex; gap: 0.6rem; flex-wrap: wrap; }
button {
  font: 500 0.95rem "Space Grotesk", sans-serif;
  padding: 0.65rem 1.5rem; border-radius: 99px; cursor: pointer;
  border: 1px solid var(--line); background: var(--panel); color: var(--text);
  transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
}
button:hover:not(:disabled) { transform: translateY(-1px); border-color: var(--dim); }
button:disabled { opacity: 0.35; cursor: default; }
#startBtn { background: var(--model); border-color: var(--model); color: #201405; font-weight: 700; }
#startBtn:hover:not(:disabled) { background: #ffc476; }
#muteBtn.muted { background: var(--danger); border-color: var(--danger); color: #2a0b0a; font-weight: 700; }

/* ---- Transcript ---- */
.chat {
  border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
  padding: 1.1rem 1.2rem; min-height: 180px; max-height: 46vh; overflow-y: auto;
}
.chat:empty::before {
  content: "Transcript appears here once you start talking.";
  font-family: "IBM Plex Mono", monospace; font-size: 0.78rem; color: var(--dim);
}
.you, .model { margin: 0.55rem 0; padding-left: 0.85rem; }
.you { border-left: 2px solid var(--you); color: var(--you); }
.model { border-left: 2px solid var(--model); }

details.log { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
details.log summary {
  cursor: pointer; padding: 0.6rem 1.1rem;
  font-family: "IBM Plex Mono", monospace; font-size: 0.7rem;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim);
  list-style-position: inside;
}
.meta {
  padding: 0 1.1rem 0.9rem; color: var(--dim);
  font-family: "IBM Plex Mono", monospace; font-size: 0.74rem;
  white-space: pre-wrap; word-break: break-word;
}

@media (prefers-reduced-motion: reduce) {
  #lamp.live { animation: none; }
  button { transition: none; }
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <div class="eyebrow">Azure AI Foundry · WebRTC · keyless</div>
    <h1>Voice Lab <span class="accent">/ gpt-realtime-2.1</span></h1>
  </div>
  <div class="eyebrow">blue = you · amber = model</div>
</header>

<div class="app">

<fieldset id="settings">
  <legend>Channel strip</legend>

  <div class="field">
    <label for="personaSel">Persona</label>
    <select id="personaSel">
      <option value="assistant" selected>Helpful assistant</option>
      <option value="interviewer">Job interviewer</option>
      <option value="tutor">Spanish tutor</option>
      <option value="storyteller">Storyteller</option>
      <option value="custom">Custom (edit below)</option>
    </select>
  </div>

  <div class="field">
    <label for="instructions">Instructions</label>
    <textarea id="instructions"></textarea>
  </div>

  <div class="field">
    <label for="voiceSel">Voice</label>
    <select id="voiceSel">
      <option value="cedar" selected>cedar — natural male (newest)</option>
      <option value="marin">marin — natural female (newest)</option>
      <option value="alloy">alloy — neutral</option>
      <option value="ash">ash — warm male</option>
      <option value="ballad">ballad — expressive British male</option>
      <option value="coral">coral — warm female</option>
      <option value="echo">echo — clear male</option>
      <option value="sage">sage — soft female</option>
      <option value="shimmer">shimmer — bright female</option>
      <option value="verse">verse — versatile male</option>
    </select>
  </div>

  <div class="field">
    <label for="speed">Speed <span class="val" id="speedVal">1.0×</span></label>
    <input type="range" id="speed" min="0.25" max="1.5" step="0.05" value="1.0">
  </div>

  <div class="field">
    <label for="patience">Patience <span class="val" id="patienceVal">500 ms</span></label>
    <input type="range" id="patience" min="200" max="2000" step="100" value="500">
  </div>

  <div class="field">
    <label for="noiseSel">Noise reduction</label>
    <select id="noiseSel">
      <option value="">Off</option>
      <option value="near_field" selected>Near field (headset / close mic)</option>
      <option value="far_field">Far field (room / laptop mic)</option>
    </select>
  </div>
</fieldset>

<div class="stage">
  <div class="orbPanel">
    <div id="status">Idle</div>
    <div id="lamp">Standby</div>
    <canvas id="viz"></canvas>
  </div>

  <div class="transport">
    <button id="startBtn">Start session</button>
    <button id="stopBtn" disabled>End</button>
    <button id="muteBtn" disabled>🎤 Mute</button>
  </div>

  <div class="chat" id="chat"></div>

  <details class="log">
    <summary>Session log</summary>
    <div class="meta" id="meta"></div>
  </details>
</div>

</div>
</div>

<script>
const PERSONAS = {
  assistant:
    "You are a friendly voice assistant helping test a GPT Realtime deployment on Azure AI Foundry. Keep replies conversational and brief.",
  interviewer:
    "You are a professional job interviewer conducting a mock interview for a cloud engineering role. Ask one question at a time, listen to the answer, give one sentence of feedback, then ask the next question.",
  tutor:
    "You are a patient Spanish tutor for a beginner. Speak mostly simple Spanish with brief English help when the learner struggles. Gently correct mistakes and keep the conversation going with easy questions.",
  storyteller:
    "You are a dramatic storyteller. Tell vivid, short stories with distinct character voices and build suspense. Ask the listener to choose what happens next at key moments.",
};

// Machine-readable event log for the synthetic voice rig (tests/rig/driver.mjs).
window.__voiceLabEvents = [];
const urlParams = new URLSearchParams(location.search);
const puppetMode = urlParams.get("puppet") === "1";
const noRoute = urlParams.get("noroute") === "1";
const VOICE_AUTH = document.querySelector('meta[name="voice-auth"]').content;
const authHeaders = { "Content-Type": "application/json", "X-Voice-Auth": VOICE_AUTH };

// Injections that arrive before the data channel opens are queued, not
// dropped — from M2 these carry hermes' actual words.
const speakQueue = [];

function speak(text) {
  if (!dataChannel || dataChannel.readyState !== "open") {
    speakQueue.push(text);
    window.__voiceLabEvents.push({ ts: Date.now(), type: "speak.queued", text });
    return;
  }
  window.__voiceLabEvents.push({ ts: Date.now(), type: "speak.received", text });
  dataChannel.send(JSON.stringify({
    type: "response.create",
    response: {
      instructions:
        "Repeat the following message exactly, verbatim, with natural warm delivery. Do not add, remove, answer, or rephrase anything: «" +
        text.replace(/[«»]/g, "") + "»",
    },
  }));
}

function flushSpeakQueue() {
  while (speakQueue.length && dataChannel && dataChannel.readyState === "open") {
    speak(speakQueue.shift());
  }
}

function recordEvent(event) {
  window.__voiceLabEvents.push({
    ts: Date.now(),
    type: event.type,
    item_id: event.item_id ?? event.item?.id ?? null,
    transcript: event.transcript ?? null,
    text: event.type === "response.output_audio_transcript.done" ? (event.transcript ?? null) : null,
  });
}

let pc = null;
let mic = null;
let dataChannel = null;
let speakSource = null;
let audioCtx = null;
let micAnalyser = null;
let remoteAnalyser = null;
let vizRunning = false;
let muted = false;

const audioEl = new Audio();
audioEl.autoplay = true;

const $ = (id) => document.getElementById(id);
const startBtn = $("startBtn"), stopBtn = $("stopBtn"), muteBtn = $("muteBtn");
const settingsBox = $("settings"), personaSel = $("personaSel");
const instructionsEl = $("instructions"), voiceSel = $("voiceSel");
const speedEl = $("speed"), speedVal = $("speedVal");
const patienceEl = $("patience"), patienceVal = $("patienceVal");
const noiseSel = $("noiseSel");
const statusEl = $("status"), chatEl = $("chat"), metaEl = $("meta");
const lampEl = $("lamp");
const viz = $("viz"), vctx = viz.getContext("2d");

instructionsEl.value = PERSONAS.assistant;
personaSel.addEventListener("change", () => {
  if (personaSel.value !== "custom") {
    instructionsEl.value = PERSONAS[personaSel.value];
  }
  instructionsEl.focus();
});
instructionsEl.addEventListener("input", () => {
  const matchesPreset = Object.entries(PERSONAS).some(
    ([, text]) => text === instructionsEl.value
  );
  if (!matchesPreset) personaSel.value = "custom";
});
speedEl.addEventListener("input", () => {
  speedVal.textContent = Number(speedEl.value).toFixed(2).replace(/0$/, "") + "×";
});
patienceEl.addEventListener("input", () => {
  patienceVal.textContent = patienceEl.value + " ms";
});

function setStatus(text) { statusEl.textContent = text; }
function setLamp(live) {
  lampEl.textContent = live ? "● Live" : "Standby";
  lampEl.classList.toggle("live", live);
}
function logMeta(text) { metaEl.textContent += text + "\n"; }

let currentModelLine = null;
let dropTranscript = false;
const pendingYouLines = {};

function markInterrupted() {
  if (currentModelLine) {
    window.__voiceLabEvents.push({ ts: Date.now(), type: "ui.interrupted" });
    currentModelLine.textContent += " ⏹ (interrupted — the model's memory is cut here too)";
    currentModelLine = null;
    dropTranscript = true;
  }
}

function addLine(cls, text) {
  const div = document.createElement("div");
  div.className = cls;
  div.textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function handleEvent(event) {
  recordEvent(event);
  switch (event.type) {
    case "session.created":
      setStatus("🟢 Connected — start talking");
      scheduleRotation(event.session);
      break;
    case "input_audio_buffer.speech_started":
      setStatus("🎤 Listening…");
      fetch("/barge-in", { method: "POST", headers: authHeaders })
        .catch(() => { /* server down; page keeps working */ });
      break;
    case "output_audio_buffer.cleared":
      markInterrupted();
      break;
    case "response.created":
      dropTranscript = false;
      speaking = true;
      break;
    case "input_audio_buffer.speech_stopped":
      setStatus("🤔 Thinking…");
      break;
    case "input_audio_buffer.committed":
      // Reserve the "You:" slot NOW — transcription arrives late, often
      // after the model has already replied.
      if (event.item_id) {
        pendingYouLines[event.item_id] = addLine("you", "You: 🎙️ …");
      }
      break;
    case "conversation.item.input_audio_transcription.completed": {
      const line = pendingYouLines[event.item_id];
      const text = (event.transcript || "").trim() || "(inaudible)";
      if (line) {
        line.textContent = "You: " + text;
        delete pendingYouLines[event.item_id];
      } else if (event.transcript) {
        addLine("you", "You: " + text);
      }
      // Ears → server: the transcript is all the brain needs [MS4].
      // Ears -> brain: the server routes this to hermes and pushes the reply
      // back over SSE as a say-exactly injection [A3][MS6].
      fetch("/turn", {
        method: "POST",
        headers: authHeaders,
        body: JSON.stringify({
          item_id: event.item_id,
          transcript: event.transcript || "",
          route: !noRoute,
        }),
      }).catch(() => { /* server down; page keeps working */ });
      break;
    }
    case "conversation.item.input_audio_transcription.failed": {
      const line = pendingYouLines[event.item_id];
      if (line) {
        line.textContent = "You: (couldn't transcribe)";
        delete pendingYouLines[event.item_id];
      }
      break;
    }
    case "response.output_audio_transcript.delta":
      if (dropTranscript) break;
      if (!currentModelLine) currentModelLine = addLine("model", "Model: ");
      currentModelLine.textContent += event.delta;
      setStatus("🔊 Speaking…");
      break;
    case "response.output_audio_transcript.done":
      currentModelLine = null;
      break;
    case "response.done":
      speaking = false;
      setStatus(muted ? "🔇 Muted" : "🟢 Your turn — keep talking or press End");
      if (rotationPending) requestRotation();
      break;
    case "error":
      logMeta("Error event: " + JSON.stringify(event));
      break;
  }
}

// --- Orb visualization ---
function levelFrom(analyser, buf) {
  analyser.getByteTimeDomainData(buf);
  let sum = 0;
  for (let i = 0; i < buf.length; i++) {
    const v = (buf[i] - 128) / 128;
    sum += v * v;
  }
  return Math.min(1, Math.sqrt(sum / buf.length) * 3);
}

// Smoothed levels so the orb glides instead of flickering
let micLevelSm = 0;
let modelLevelSm = 0;

function drawViz() {
  if (!vizRunning) return;
  const w = viz.width = viz.clientWidth * devicePixelRatio;
  const h = viz.height = viz.clientHeight * devicePixelRatio;
  vctx.clearRect(0, 0, w, h);

  const buf = new Uint8Array(1024);
  const micLevel = muted ? 0 : (micAnalyser ? levelFrom(micAnalyser, buf) : 0);
  const modelLevel = remoteAnalyser ? levelFrom(remoteAnalyser, buf) : 0;
  micLevelSm += (micLevel - micLevelSm) * 0.25;
  modelLevelSm += (modelLevel - modelLevelSm) * 0.25;

  const cx = w / 2;
  const cy = h / 2;
  const breathe = 1 + 0.03 * Math.sin(performance.now() / 600);
  const baseR = Math.min(w, h) * 0.22 * breathe;

  // Core = the model's voice (amber glow that swells as it speaks)
  const coreR = baseR * (1 + modelLevelSm * 1.1);
  const glow = vctx.createRadialGradient(cx, cy, coreR * 0.1, cx, cy, coreR * 1.6);
  const coreColor = muted ? "139,145,165" : "255,180,84";
  glow.addColorStop(0, `rgba(${coreColor},0.95)`);
  glow.addColorStop(0.55, `rgba(${coreColor},${0.35 + modelLevelSm * 0.5})`);
  glow.addColorStop(1, `rgba(${coreColor},0)`);
  vctx.fillStyle = glow;
  vctx.beginPath();
  vctx.arc(cx, cy, coreR * 1.6, 0, Math.PI * 2);
  vctx.fill();

  // Ring = your voice (blue ring that expands as you talk)
  const ringR = coreR * 1.15 + baseR * micLevelSm * 1.4;
  vctx.lineWidth = (2 + micLevelSm * 10) * devicePixelRatio;
  vctx.strokeStyle = muted
    ? "rgba(139,145,165,0.35)"
    : `rgba(106,165,255,${0.35 + micLevelSm * 0.65})`;
  vctx.beginPath();
  vctx.arc(cx, cy, ringR, 0, Math.PI * 2);
  vctx.stroke();

  // Label under the orb
  vctx.fillStyle = "#8b91a5";
  vctx.globalAlpha = 0.9;
  vctx.font = `${11 * devicePixelRatio}px "IBM Plex Mono", monospace`;
  vctx.textAlign = "center";
  const label = muted
    ? "muted"
    : modelLevelSm > 0.06 ? "speaking"
    : micLevelSm > 0.06 ? "hearing you"
    : "listening";
  vctx.fillText(label, cx, h - 14 * devicePixelRatio);
  vctx.globalAlpha = 1;
  vctx.textAlign = "start";

  requestAnimationFrame(drawViz);
}

// Session rotation [MS14][MS17]: sessions expire at 60 minutes. Microsoft's
// documented pattern is to watch session.created's expires_at and renew before
// it — not to guess with a fixed clock. The ACP session is untouched, so
// hermes never notices the mouth was swapped [H3].
let rotationTimer = null;
let speaking = false;
let rotationPending = false;

function scheduleRotation(session) {
  clearTimeout(rotationTimer);
  const testSecs = Number(new URLSearchParams(location.search).get("rotate_secs") || 0);
  let ms;
  if (testSecs > 0) {
    ms = testSecs * 1000;
  } else if (session?.expires_at) {
    const marginMs = 10 * 60 * 1000; // renew 10 minutes early [MS17]
    ms = Math.max(30_000, session.expires_at * 1000 - Date.now() - marginMs);
  } else {
    return; // no expiry advertised: nothing to schedule
  }
  logMeta(`Rotation scheduled in ${Math.round(ms / 1000)}s`);
  rotationTimer = setTimeout(() => requestRotation(), ms);
}

function requestRotation() {
  if (speaking) {
    // Never cut the mouth mid-sentence; retry at the next response.done.
    rotationPending = true;
    window.__voiceLabEvents.push({ ts: Date.now(), type: "rotation.deferred" });
    return;
  }
  rotationPending = false;
  window.__voiceLabEvents.push({ ts: Date.now(), type: "rotation.start" });
  const wasMuted = muted;
  stop({ keepBrain: true });
  start().then(() => { if (wasMuted) setMuted(true); });
}

// Faint idle orb so the stage is never an empty box
function drawIdleOrb() {
  const w = viz.width = viz.clientWidth * devicePixelRatio;
  const h = viz.height = viz.clientHeight * devicePixelRatio;
  vctx.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const baseR = Math.min(w, h) * 0.22;
  const glow = vctx.createRadialGradient(cx, cy, baseR * 0.1, cx, cy, baseR * 1.6);
  glow.addColorStop(0, "rgba(255,180,84,0.28)");
  glow.addColorStop(0.55, "rgba(255,180,84,0.10)");
  glow.addColorStop(1, "rgba(255,180,84,0)");
  vctx.fillStyle = glow;
  vctx.beginPath();
  vctx.arc(cx, cy, baseR * 1.6, 0, Math.PI * 2);
  vctx.fill();
  vctx.lineWidth = 1.5 * devicePixelRatio;
  vctx.strokeStyle = "rgba(106,165,255,0.18)";
  vctx.beginPath();
  vctx.arc(cx, cy, baseR * 1.15, 0, Math.PI * 2);
  vctx.stroke();
  vctx.fillStyle = "#8b91a5";
  vctx.font = `${11 * devicePixelRatio}px "IBM Plex Mono", monospace`;
  vctx.textAlign = "center";
  vctx.fillText("standby", cx, h - 14 * devicePixelRatio);
  vctx.textAlign = "start";
}

function setMuted(next) {
  muted = next;
  const track = mic && mic.getAudioTracks()[0];
  if (track) track.enabled = !muted;
  muteBtn.textContent = muted ? "🔇 Unmute" : "🎤 Mute";
  muteBtn.classList.toggle("muted", muted);
  if (muted) setStatus("🔇 Muted — it can't hear you");
  else setStatus("🟢 Mic live — start talking");
}

async function start() {
  startBtn.disabled = true;
  settingsBox.disabled = true;
  try {
    setStatus("Minting ephemeral key…");
    const tokenResp = await fetch("/token", {
      method: "POST",
      headers: authHeaders,
      body: JSON.stringify({
        voice: voiceSel.value,
        speed: Number(speedEl.value),
        silence_duration_ms: Number(patienceEl.value),
        noise_reduction: noiseSel.value || undefined,
        instructions: instructionsEl.value,
        puppet: puppetMode,
      }),
    });
    if (!tokenResp.ok) {
      throw new Error("Token service error: " + (await tokenResp.text()));
    }
    const { ephemeralKey, callsUrl, settings } = await tokenResp.json();
    if (!ephemeralKey) throw new Error("No ephemeral key in response.");
    logMeta("Session settings: " + JSON.stringify(settings));

    setStatus("Requesting microphone…");
    const devices = await navigator.mediaDevices.enumerateDevices();
    const inputs = devices.filter((d) => d.kind === "audioinput");
    if (inputs.length === 0) {
      throw new Error(
        "No microphone detected on this computer. Plug in a USB/Bluetooth headset (AirPods work) and reload the page."
      );
    }
    logMeta("Microphones found: " + inputs.length);
    try {
      mic = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      if (err.name === "NotAllowedError") {
        throw new Error(
          "Microphone access denied. Check browser permission for this site AND the OS-level mic permission (macOS: System Settings → Privacy & Security → Microphone → allow your browser)."
        );
      }
      if (err.name === "NotFoundError") {
        throw new Error(
          "No usable microphone found. Plug in a headset and reload the page."
        );
      }
      throw err;
    }

    audioCtx = new AudioContext();
    micAnalyser = audioCtx.createAnalyser();
    audioCtx.createMediaStreamSource(mic).connect(micAnalyser);

    pc = new RTCPeerConnection();
    pc.ontrack = (e) => {
      audioEl.srcObject = e.streams[0];
      remoteAnalyser = audioCtx.createAnalyser();
      audioCtx.createMediaStreamSource(e.streams[0]).connect(remoteAnalyser);
    };
    pc.addTrack(mic.getTracks()[0], mic);

    dataChannel = pc.createDataChannel("oai-events");
    dataChannel.onopen = () => { logMeta("Data channel open."); flushSpeakQueue(); };
    dataChannel.onmessage = (e) => {
      try { handleEvent(JSON.parse(e.data)); } catch { /* non-JSON frame */ }
    };

    // Server → mouth: /speak relays arrive over SSE; each becomes a
    // per-response instructions override — say exactly this [MS6][C1].
    speakSource = new EventSource("/events?auth=" + encodeURIComponent(VOICE_AUTH));
    speakSource.onopen = () => {
      window.__voiceLabEvents.push({ ts: Date.now(), type: "sse.open" });
      logMeta("Control channel open.");
    };
    speakSource.onerror = () => {
      window.__voiceLabEvents.push({ ts: Date.now(), type: "sse.error" });
    };
    speakSource.onmessage = (e) => {
      let msg;
      try { msg = JSON.parse(e.data); } catch { return; }
      window.__voiceLabEvents.push({
        ts: Date.now(), type: "sse.message", text: msg.text ?? null,
        dcState: dataChannel ? dataChannel.readyState : "null",
      });
      if (msg.type === "filler") {
        if (!dataChannel || dataChannel.readyState !== "open") return;
        window.__voiceLabEvents.push({ ts: Date.now(), type: "filler.sent", text: msg.text });
        dataChannel.send(JSON.stringify({
          type: "response.create",
          response: {
            conversation: "none",           // never joins the conversation [C1]
            metadata: { purpose: "filler" }, // identifiable in server events [C7]
            instructions:
              "Say exactly this, warmly and briefly, then stop: «" +
              msg.text.replace(/[«»]/g, "") + "»",
          },
        }));
        return;
      }
      if (msg.type !== "speak") return;
      speak(msg.text);
    };

    setStatus("Negotiating WebRTC…");
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const sdpResp = await fetch(callsUrl, {
      method: "POST",
      headers: {
        Authorization: "Bearer " + ephemeralKey,
        "Content-Type": "application/sdp",
      },
      body: offer.sdp,
    });
    if (!sdpResp.ok) {
      throw new Error("SDP exchange failed: " + sdpResp.status + " " + (await sdpResp.text()));
    }
    await pc.setRemoteDescription({ type: "answer", sdp: await sdpResp.text() });

    stopBtn.disabled = false;
    muteBtn.disabled = false;
    vizRunning = true;
    drawViz();
    setLamp(true);
    setStatus("🟢 Connected — start talking");
  } catch (err) {
    setStatus("❌ " + err.message);
    logMeta(String(err.stack || err));
    stop();
  }
}

function stop(opts = {}) {
  vizRunning = false;
  if (speakSource) { speakSource.close(); speakSource = null; }
  if (dataChannel) { dataChannel.close(); dataChannel = null; }
  if (pc) { pc.close(); pc = null; }
  if (mic) { mic.getTracks().forEach((t) => t.stop()); mic = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  micAnalyser = null;
  remoteAnalyser = null;
  muted = false;
  muteBtn.textContent = "🎤 Mute";
  muteBtn.classList.remove("muted");
  muteBtn.disabled = true;
  startBtn.disabled = false;
  stopBtn.disabled = true;
  settingsBox.disabled = false;
  setLamp(false);
  drawIdleOrb();
  if (!statusEl.textContent.startsWith("❌")) setStatus("Stopped");
}

startBtn.addEventListener("click", start);
stopBtn.addEventListener("click", stop);
muteBtn.addEventListener("click", () => setMuted(!muted));
drawIdleOrb();
window.addEventListener("resize", () => { if (!vizRunning) drawIdleOrb(); });
</script>
</body>
</html>
